<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Renewly prismatic knob</title>
  <desc id="desc">A smooth, polished circular knob lit with warm prismatic color.</desc>
  <defs>
    <clipPath id="knobClip">
      <circle cx="512" cy="512" r="448"/>
    </clipPath>

    <radialGradient id="base" cx="0" cy="0" r="1" gradientTransform="translate(360 310) rotate(48) scale(690)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.44" stop-color="#e8c8ac"/>
      <stop offset="0.72" stop-color="#527c78"/>
      <stop offset="1" stop-color="#171512"/>
    </radialGradient>

    <radialGradient id="dome" cx="0" cy="0" r="1" gradientTransform="translate(390 342) rotate(48) scale(610 628)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.47" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#40362d" stop-opacity="0.08"/>
      <stop offset="0.9" stop-color="#12110f" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#080807" stop-opacity="0.8"/>
    </radialGradient>

    <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="translate(342 284) rotate(43) scale(432 390)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.2" stop-color="#fffdf8" stop-opacity="0.77"/>
      <stop offset="0.48" stop-color="#fffaf0" stop-opacity="0.24"/>
      <stop offset="0.76" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="202" y1="166" x2="838" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.16" stop-color="#fff9e9" stop-opacity="0.62"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.7" stop-color="#151410" stop-opacity="0.68"/>
      <stop offset="0.88" stop-color="#dba864" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="shadow" x="-22%" y="-22%" width="144%" height="154%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#130f0b" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#130f0b" flood-opacity="0.22"/>
    </filter>

    <filter id="blend" x="-16%" y="-16%" width="132%" height="132%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="448" fill="url(#base)"/>

    <g clip-path="url(#knobClip)">
      <g filter="url(#blend)" transform="rotate(-8 512 512)">
        <path d="M512 512L512-48A560 560 0 0 1 792 27Z" fill="#fff8e6"/>
        <path d="M512 512L792 27A560 560 0 0 1 997 232Z" fill="#72c5bd"/>
        <path d="M512 512L997 232A560 560 0 0 1 1072 512Z" fill="#3d8f94"/>
        <path d="M512 512L1072 512A560 560 0 0 1 997 792Z" fill="#1b2525"/>
        <path d="M512 512L997 792A560 560 0 0 1 792 997Z" fill="#171512"/>
        <path d="M512 512L792 997A560 560 0 0 1 512 1072Z" fill="#9b5b3e"/>
        <path d="M512 512L512 1072A560 560 0 0 1 232 997Z" fill="#e7a24f"/>
        <path d="M512 512L232 997A560 560 0 0 1 27 792Z" fill="#ffd178"/>
        <path d="M512 512L27 792A560 560 0 0 1-48 512Z" fill="#eb795e"/>
        <path d="M512 512L-48 512A560 560 0 0 1 27 232Z" fill="#d78b9b"/>
        <path d="M512 512L27 232A560 560 0 0 1 232 27Z" fill="#6f82bd"/>
        <path d="M512 512L232 27A560 560 0 0 1 512-48Z" fill="#9bd6ce"/>
      </g>

      <ellipse cx="355" cy="280" rx="430" ry="344" fill="url(#shine)" transform="rotate(-16 355 280)"/>
      <ellipse cx="792" cy="720" rx="280" ry="210" fill="#0b0c0b" opacity="0.17" filter="url(#blend)"/>

      <circle cx="512" cy="512" r="448" fill="url(#dome)"/>
    </g>

    <circle cx="512" cy="512" r="446" fill="none" stroke="url(#rim)" stroke-width="4"/>
  </g>
</svg>
