services:
  postgres:
    image: postgres:16-alpine
    container_name: renewly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: renewly
    # 5432 is the conventional port and is often already taken by another
    # project's container, so publish on 5433 and leave the default free.
    # Bound to loopback: this database has no password worth the name.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - renewly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  renewly-pgdata:
